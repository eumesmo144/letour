   AFRAME.registerComponent("coord-debugger", {
  init: function () {
    window.addEventListener("keydown", (event) => {
      if (event.key.toLowerCase() !== "c") return;

      const cameraEl = document.querySelector("[camera]");
      const container = document.querySelector("#hotspots");

      if (!cameraEl || !container) {
        console.warn("Câmera ou container de hotspots não encontrados.");
        return;
      }

      const camera = cameraEl.object3D;

      const cameraPosition = new THREE.Vector3();
      const direction = new THREE.Vector3();

      camera.getWorldPosition(cameraPosition);
      camera.getWorldDirection(direction);

      const distance = 4;

      /*
        Como sua esfera está invertida, usamos o sentido oposto.
        Agora NÃO zeramos direction.y.
        Assim a altura também é capturada.
      */
      const x = cameraPosition.x - direction.x * distance;
      const y = cameraPosition.y - direction.y * distance;
      const z = cameraPosition.z - direction.z * distance;

      const position = `${x.toFixed(2)} ${y.toFixed(2)} ${z.toFixed(2)}`;

      console.log("===================================");
      console.log("Coordenada A-Frame com altura livre:", position);
      console.log(`position: "${position}"`);
      console.log("===================================");

      const marker = document.createElement("a-sphere");
      marker.setAttribute("position", position);
      marker.setAttribute("radius", "0.18");
      marker.setAttribute("color", "red");
      marker.setAttribute("material", "shader: flat; color: red");

      container.appendChild(marker);

      setTimeout(() => {
        if (marker.parentNode) {
          marker.parentNode.removeChild(marker);
        }
      }, 5000);

      if (navigator.clipboard) {
        navigator.clipboard.writeText(position)
          .then(() => console.log("Coordenada copiada:", position))
          .catch(() => console.log("Copie manualmente:", position));
      }
    });
  }

    function initScenes() {
      try {
        if (!tourData || !tourData.images) {
          console.error("tourData.images não encontrado.");
          return;
        }

        scenes = JSON.parse(tourData.images);
        console.log("Cenas carregadas:", scenes.length);
      } catch (error) {
        console.error("Erro ao carregar tourData.images:", error);
        scenes = [];
      }
    }

    function getSceneById(sceneId) {
      return scenes.find(scene => scene.id === sceneId);
    }

    function getOptimizedSceneUrl(scene) {
      return `images_aframe/scene-${scene.id}.jpg`;
    }

    function clearHotspots() {
      const container = document.querySelector("#hotspots");
      if (container) {
        container.innerHTML = "";
      }
    }

    function convertCoords(coords) {
      if (!coords) {
        return "0 1.5 -3";
      }

      let source = null;

      if (coords.scene) {
        source = coords.scene;
      } else if (coords.plane) {
        source = coords.plane;
      } else {
        source = coords;
      }

      let x = Number(source.x || 0);
      let y = Number(source.y || 0);
      let z = Number(source.z || 0);

      const length = Math.sqrt(x * x + y * y + z * z) || 1;

      x = x / length;
      y = y / length;
      z = z / length;

      return `${x * HOTSPOT_DISTANCE} ${y * HOTSPOT_DISTANCE} ${z * HOTSPOT_DISTANCE}`;
    }

    function createNavigationHotspot(hotspot) {
  if (!hotspot || !hotspot.image || !hotspot.image.id) {
    return null;
  }

  const targetSceneId = normalizeId(hotspot.image.id);
  const targetTitle = hotspot.image.title || "Avançar";
  const currentSceneId = normalizeId(window.currentSceneId);

  console.log("Hotspot:", currentSceneId, "->", targetSceneId, targetTitle);

  const wrapper = document.createElement("a-entity");
  wrapper.setAttribute("class", "clickable");

  const manualPosition =
    MANUAL_HOTSPOT_POSITIONS[currentSceneId] &&
    MANUAL_HOTSPOT_POSITIONS[currentSceneId][targetSceneId];

  const finalPosition = manualPosition || convertCoords(hotspot.coords);


  wrapper.setAttribute("position", finalPosition);
  wrapper.setAttribute("look-at-camera", "");

  const customIcon =
    CUSTOM_HOTSPOT_ICONS[currentSceneId] &&
    CUSTOM_HOTSPOT_ICONS[currentSceneId][targetSceneId];

  const iconPath =
    customIcon || "assets/img/hotspot-icon-black-thumb-removebg-preview.png";

  const arrowImage = document.createElement("a-image");
  arrowImage.setAttribute(
    "material",
    `src: url(${iconPath}); transparent: true; alphaTest: 0.1; shader: flat`
  );
  arrowImage.setAttribute("width", "0.6");
  arrowImage.setAttribute("height", "0.6");
  arrowImage.setAttribute("class", "clickable");

  const label = document.createElement("a-text");
  label.setAttribute("value", targetTitle);
  label.setAttribute("align", "center");
  label.setAttribute("color", "#ffffff");
  label.setAttribute("width", "2");
  label.setAttribute("position", "0 -0.45 0");

  wrapper.appendChild(arrowImage);
  wrapper.appendChild(label);

  wrapper.addEventListener("click", () => {
    loadScene(targetSceneId);
  });
  arrowImage.addEventListener("click", (event) => {
  event.stopPropagation();
  loadScene(targetSceneId);
});

  return wrapper;

function openImageModal(data) {
  const modal = document.querySelector("#image-modal");
  const modalImage = document.querySelector("#modal-image");
  const modalTitle = document.querySelector("#modal-title");
  const modalText = document.querySelector("#modal-text");
  const camera = document.querySelector("[camera]");

  if (!modal || !modalImage || !modalTitle || !modalText || !camera) {
    console.warn("Modal ou câmera não encontrados.");
    return;
  }

  modalImage.setAttribute(
    "material",
    `shader: flat; src: url(${data.image}); transparent: true`
  );

  modalTitle.setAttribute("value", data.title || "Juazeiro");
  modalText.setAttribute("value", data.text || "");

  if (data.modalPosition) {
    modal.setAttribute("position", data.modalPosition);
  } else {
    modal.setAttribute("position", "0 1.6 -2.5");
  }

  // faz o modal olhar para a câmera
  const cameraPosition = new THREE.Vector3();
  camera.object3D.getWorldPosition(cameraPosition);
  modal.object3D.lookAt(cameraPosition);

  modal.setAttribute("visible", "true");
}

function closeImageModal() {
  const modal = document.querySelector("#image-modal");

  if (modal) {
    modal.setAttribute("visible", "false");
  }
}

function createImageModalHotspot(data) {
  const wrapper = document.createElement("a-entity");

  wrapper.setAttribute("position", data.position);
  wrapper.setAttribute("look-at-camera", "");

  /*
    Área invisível maior para o gaze acertar.
    O cursor/fuse vai mirar nesse plano.
  */
  const hitbox = document.createElement("a-plane");
  hitbox.setAttribute("class", "clickable");
  hitbox.setAttribute("width", "1.1");
  hitbox.setAttribute("height", "1.1");
  hitbox.setAttribute("position", "0 0 0.06");
  hitbox.setAttribute(
    "material",
    "color: #ffffff; opacity: 0.01; transparent: true; shader: flat; side: double"
  );

  const icon = document.createElement("a-image");
  icon.setAttribute(
    "material",
    `src: url(${data.icon || DEFAULT_INFO_ICON}); transparent: true; alphaTest: 0.1; shader: flat`
  );
  icon.setAttribute("width", "0.55");
  icon.setAttribute("height", "0.55");
  icon.setAttribute("position", "0 0 0.08");

  const label = document.createElement("a-text");
  label.setAttribute("value", data.title || "Info");
  label.setAttribute("align", "center");
  label.setAttribute("color", "#ffffff");
  label.setAttribute("width", "2");
  label.setAttribute("position", "0 -0.42 0.09");

  function openByGaze(event) {
    if (event) {
      event.stopPropagation();
    }

    console.log("Infospot de imagem clicado por gaze:", data.title);
    openImageModal(data);
  }

  /*
    O click principal precisa estar no hitbox,
    porque é ele que o gaze realmente intercepta.
  */
  hitbox.addEventListener("click", openByGaze);

  wrapper.appendChild(hitbox);
  wrapper.appendChild(icon);
  wrapper.appendChild(label);

  return wrapper;
}
function openVideoModal(data) {
  const modal = document.querySelector("#video-modal");
  const video = document.querySelector("#modal-video");
  const title = document.querySelector("#video-modal-title");
  const text = document.querySelector("#video-modal-text");
  const camera = document.querySelector("[camera]");

  if (!modal || !video || !title || !text || !camera) {
    console.warn("Modal de vídeo ou câmera não encontrados.");
    return;
  }

  video.setAttribute("src", data.video);
  title.setAttribute("value", data.title || "Vídeo");
  text.setAttribute("value", data.text || "");

  const cameraObject = camera.object3D;
  const cameraPosition = new THREE.Vector3();
  const direction = new THREE.Vector3();

  cameraObject.getWorldPosition(cameraPosition);
  cameraObject.getWorldDirection(direction);

  const modalPosition = cameraPosition.clone().add(direction.multiplyScalar(1.6));

  modal.object3D.position.copy(modalPosition);
  modal.object3D.lookAt(cameraPosition);

  modal.setAttribute("visible", "true");

  const videoEl = video.components.material?.material?.map?.image;

  if (videoEl && videoEl.play) {
    videoEl.play().catch(error => {
      console.warn("Não foi possível iniciar o vídeo automaticamente:", error);
    });
  }
}

function closeVideoModal() {
  const modal = document.querySelector("#video-modal");
  const video = document.querySelector("#modal-video");

  if (video) {
    const videoEl = video.components.material?.material?.map?.image;

    if (videoEl && videoEl.pause) {
      videoEl.pause();
      videoEl.currentTime = 0;
    }

    video.removeAttribute("src");
  }

  if (modal) {
    modal.setAttribute("visible", "false");
  }
}

function createVideoModalHotspot(data) {
  const wrapper = document.createElement("a-entity");

  wrapper.setAttribute("position", data.position);
  wrapper.setAttribute("look-at-camera", "");

  const hitbox = document.createElement("a-plane");

  icon.setAttribute("position", "0 0 0.08");

  const label = document.createElement("a-text");
  label.setAttribute("value", data.title || "Vídeo");
  label.setAttribute("align", "center");
  label.setAttribute("color", "#ffffff");
  label.setAttribute("width", "2");
  label.setAttribute("position", "0 -0.42 0.09");

  function handleClick(event) {
    if (event) {
      event.stopPropagation();
    }

    console.log("Hotspot de vídeo clicado:", data.title);

  }

  hitbox.addEventListener("click", handleClick);

  wrapper.appendChild(hitbox);

}
    function renderHotspots(scene) {
      clearHotspots();

      const container = document.querySelector("#hotspots");

      if (!container || !scene) {
        return;
      }

      if (!Array.isArray(scene.hotspots)) {
        console.warn("Cena sem hotspots:", scene.title);
        return;
      }
const videoHotspots = MANUAL_VIDEO_MODAL_HOTSPOTS[normalizeId(scene.id)] || [];

videoHotspots.forEach(hotspot => {
  try {
    const entity = createVideoModalHotspot(hotspot);

    if (entity) {
      container.appendChild(entity);
    }
  } catch (error) {
    console.warn("Erro ao criar hotspot de vídeo:", hotspot, error);
  }
});
      scene.hotspots.forEach(hotspot => {
        try {
          const entity = createNavigationHotspot(hotspot);

          if (entity) {
            container.appendChild(entity);
          }
        } catch (error) {
          console.warn("Erro ao criar hotspot:", hotspot, error);
        }
      });

  const modalHotspots = MANUAL_IMAGE_MODAL_HOTSPOTS[normalizeId(scene.id)] || [];

  modalHotspots.forEach(hotspot => {
  try {
    const entity = createImageModalHotspot(hotspot);

    if (entity) {
      container.appendChild(entity);
    }
  } catch (error) {
    console.warn("Erro ao criar hotspot de modal:", hotspot, error);
  }
});
    }

    function loadScene(sceneId) {
      window.currentSceneId = sceneId;

      const scene = getSceneById(sceneId);

      if (!scene) {
        console.error("Cena não encontrada:", sceneId);
        return;
      }

      const panorama = document.querySelector("#panorama");
      const title = document.querySelector("#scene-title");

      const optimizedUrl = getOptimizedSceneUrl(scene);

      console.log("Carregando cena:", scene.title);
      console.log("ID da cena atual:", scene.id);

      panorama.setAttribute(
        "material",
        `shader: flat; src: url(${optimizedUrl}); side: back`
      );

      if (title) {
        title.setAttribute("value", scene.title || scene.id);
      }

      renderHotspots(scene);
    }

    AFRAME.registerComponent("look-at-camera", {
      tick: function () {
        const camera = document.querySelector("[camera]");

        if (!camera) {
          return;
        }

        this.el.object3D.lookAt(camera.object3D.position);
      }
    });

window.addEventListener("DOMContentLoaded", () => {
  initScenes();
const videoCloseButton = document.querySelector("#video-modal-close");
const videoCloseText = document.querySelector("#video-modal-close-text");

if (videoCloseButton) {
  videoCloseButton.addEventListener("click", closeVideoModal);
}

if (videoCloseText) {
  videoCloseText.addEventListener("click", closeVideoModal);
}
  const closeButton = document.querySelector("#modal-close");
  const closeButtonBg = document.querySelector("#modal-close-bg");
  const closeText = document.querySelector("#modal-close-text");

  if (closeButton) {
    closeButton.addEventListener("click", closeImageModal);
  }

  if (closeButtonBg) {
    closeButtonBg.addEventListener("click", closeImageModal);
  }

  if (closeText) {
    closeText.addEventListener("click", closeImageModal);
  }

  const sceneEl = document.querySelector("a-scene");

  if (sceneEl) {
    sceneEl.addEventListener("loaded", () => {
      console.log("A-Frame carregado.");
      loadScene(START_SCENE_ID);
    });
  } else {
    console.error("a-scene não encontrado.");
  }
});
